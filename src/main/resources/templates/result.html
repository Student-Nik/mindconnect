<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quiz Result</title>
<style>
    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(to right, violet, blue);
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
    }

    h2 {
        font-size: 28px;
        margin-bottom: 10px;
        color: #2d2d2d;
    }

    p {
        font-size: 18px;
        margin: 8px 0;
    }

    button {
        background-color: black;
        color: white;
        border: none;
        padding: 12px 24px;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s ease;
        margin-top: 20px;
    }

    button:hover {
        background-color: white;
        color: black;
        border: none;
        padding: 12px 24px;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s ease;
        margin-top: 20px; 
    }
    a {
        text-decoration: none;
    }
    .rights{
         margin:100px 100px;
    }
</style>
</head>
<body>
   <center>
    <h2 th:text="'Hi ' + ${name} + ','"></h2>
    <p th:text="'Your quiz score is: ' + ${score}"></p>
    <p th:text="${message}"></p>

    <div th:if="${score >= 10}">
        <a href="/meeting">
            <button>Book Appointment</button>
        </a>
    </div>
    <p class="rights">&copy all rights reserved by mindconnect</p>
    </center>
</body>
</html>
